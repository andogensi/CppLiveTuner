name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform.os }} / ${{ matrix.platform.compiler }} / ${{ matrix.config }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        platform:
          - {os: ubuntu-24.04, compiler: g++}
          - {os: ubuntu-24.04, compiler: clang++}
          - {os: windows-latest, compiler: MSVC}
          - {os: macos-14, compiler: clang++}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        shell: bash
        run: |
          args=()
          if [[ '${{ matrix.platform.compiler }}' != 'MSVC' ]]; then
            args+=("-DCMAKE_CXX_COMPILER=${{ matrix.platform.compiler }}")
          fi
          cmake -S . -B build "${args[@]}" -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DLIVETUNER_BUILD_TESTS=ON -DLIVETUNER_BUILD_EXAMPLES=ON -DLIVETUNER_TEST_OPTIONAL_BACKENDS=ON
      - name: Build (warnings are errors)
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Run regression tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --parallel 2
      - name: Install
        run: cmake --install build --config ${{ matrix.config }} --prefix "${{ github.workspace }}/install"
      - name: Configure installed consumer
        run: cmake -S tests/package -B package-build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
      - name: Build installed consumer
        run: cmake --build package-build --config ${{ matrix.config }} --parallel 2
      - name: Test installed consumer
        run: ctest --test-dir package-build -C ${{ matrix.config }} --output-on-failure --no-tests=error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.platform.os }}-${{ matrix.platform.compiler }}-${{ matrix.config }}
          path: |
            build/Testing/Temporary/
            package-build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve a compatible TSan shadow address range
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DLIVETUNER_BUILD_TESTS=ON -DLIVETUNER_TEST_OPTIONAL_BACKENDS=ON -DLIVETUNER_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run instrumented tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel 2
      - name: Retain sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-${{ matrix.sanitizer }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DLIVETUNER_BUILD_FUZZER=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Fuzz bounded parsers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/livetuner_fuzz tests/fuzz_corpus -max_total_time=45 -timeout=3 -rss_limit_mb=512 -max_len=1048577

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject CI failure suppression and mutable action references
        run: python3 tests/check_ci_policy.py

  required:
    name: Required CI
    if: always()
    needs: [build, sanitizers, fuzz, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          BUILD: ${{ needs.build.result }}
          SANITIZERS: ${{ needs.sanitizers.result }}
          FUZZ: ${{ needs.fuzz.result }}
          POLICY: ${{ needs.policy.result }}
        run: |
          test "$BUILD" = success
          test "$SANITIZERS" = success
          test "$FUZZ" = success
          test "$POLICY" = success
